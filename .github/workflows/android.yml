name: Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK and check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Restore stable debug signing key for trusted builds
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::Configure the ANDROID_DEBUG_KEYSTORE repository secret before building."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          certificate=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f1)
          if [ "$certificate" != "68ab9363b968fda9b4623153b32ea4de756d75e5a2582786c18e493abe8123ed" ]; then
            echo "::error::The debug signing certificate does not match the Pixel development build."
            exit 1
          fi

      - name: Explain isolated fork signing
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::warning::Fork PRs cannot access the stable debug key. This APK uses an isolated runner key and cannot update a Pixel development install in place."
          echo "Fork PR: isolated debug signing; this APK cannot update the regular development install in place." >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK, run unit tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --max-workers=2 --no-daemon

      - name: Upload downloadable debug APK
        id: apk
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: folio-debug-${{ github.event.pull_request.number || github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Link APK in build summary
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          echo "### Folio debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download APK artifact]($APK_URL) (ZIP containing app-debug.apk)." >> "$GITHUB_STEP_SUMMARY"
          echo "For testing only, not a signed production release. GitHub sign-in is required to download; retained for 30 days." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-reports-${{ github.event.pull_request.number || github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove runner debug signing key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
